[project]
name = "listingwatcher"
version = "0.1.0"
description = "Listing watch (leboncoin + eBay): profiles, price tiers, anti-scam, ntfy notifications, review UI"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "ruamel.yaml>=0.18",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["listingwatcher*"]
